name: 🤖 Build Android Widget APK

on:
  push:
    branches:
      - main
    paths:
      - 'android-widget/**'
      - '.github/workflows/build-android-widget.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-builder
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & Licenses
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Gamingpig Widget APK
        run: gradle -p android-widget assembleRelease --no-daemon

      - name: Publish APK to downloads folder
        run: |
          mkdir -p downloads about-qa-main/downloads
          cp android-widget/app/build/outputs/apk/release/app-release.apk downloads/GamingpigWidget.apk
          cp android-widget/app/build/outputs/apk/release/app-release.apk about-qa-main/downloads/GamingpigWidget.apk

      - name: Commit & Push APK to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/GamingpigWidget.apk about-qa-main/downloads/GamingpigWidget.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, skipping commit."
            exit 0
          fi
          git commit -m "build(android): publish GamingpigWidget.apk [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}"
            if git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
          done
          exit 1
