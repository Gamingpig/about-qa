name: Sync votes and wishes

on:
  repository_dispatch:
    types: [new-vote-or-wish]
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/roadmap-sync.yml'
      - 'scripts/sync-roadmap.cjs'
      - 'js/roadmap-protocol.js'

permissions:
  contents: write

concurrency:
  group: portfolio-data-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Import signed votes and wishes
        run: node scripts/sync-roadmap.cjs
      - name: Persist roadmap only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/roadmap.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(data): sync votes and wishes [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}"
            if git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
          done
          exit 1
