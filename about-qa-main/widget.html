<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gamingpig Now-Playing Live Widget</title>
    <meta name="theme-color" content="#030712">
    <meta name="description" content="Interaktives Now-Playing Live-Widget für Gamingpig mit Echtzeit-Synchronisation">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background-color: #030712;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }
        body.theme-oled {
            background-color: #000000 !important;
        }
        .widget-container {
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            padding: 18px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.85) 100%);
            border: 1px solid rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.12);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        body.theme-oled .widget-container {
            background: #000000 !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9) !important;
        }
        body.theme-cyber .widget-container {
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.92) 0%, rgba(88, 28, 135, 0.45) 100%) !important;
            border-color: rgba(236, 72, 153, 0.4) !important;
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.25), 0 0 20px rgba(6, 182, 212, 0.2) !important;
        }
        .ambient-glow {
            position: absolute;
            top: -40%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(30px);
            transition: opacity 0.5s ease;
        }
        body.theme-oled .ambient-glow { display: none; }
        body.theme-cyber .ambient-glow {
            background: radial-gradient(circle, rgba(236, 72, 153, 0.4) 0%, transparent 70%);
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            position: relative;
            z-index: 2;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 9999px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .status-badge.idle {
            background: rgba(148, 163, 184, 0.15);
            border-color: rgba(148, 163, 184, 0.3);
            color: #94a3b8;
        }
        .pulse-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
            animation: pulse 1.8s infinite;
        }
        .status-badge.idle .pulse-dot {
            background: #94a3b8;
            box-shadow: none;
            animation: none;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }
        .brand {
            font-size: 11px;
            font-weight: 800;
            color: #64748b;
            letter-spacing: 0.05em;
        }
        .content {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
            position: relative;
            z-index: 2;
        }
        .cover-wrap {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            overflow: hidden;
            flex-shrink: 0;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }
        .track-info {
            min-width: 0;
            flex: 1;
        }
        .track-title {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.25;
            letter-spacing: -0.01em;
        }
        .track-artist {
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 3px;
        }
        .spotify-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 6px;
            font-size: 10px;
            font-weight: 700;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .spotify-tag:hover {
            background: rgba(56, 189, 248, 0.22);
            color: #7dd3fc;
        }
        .progress-box {
            position: relative;
            z-index: 2;
        }
        .bar-bg {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border-radius: 9999px;
            transition: width 0.4s linear;
        }
        body.theme-cyber .bar-fill {
            background: linear-gradient(90deg, #ec4899, #06b6d4) !important;
        }
        .timestamps {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 10px;
            color: #64748b;
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-weight: 600;
        }
        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 2;
        }
        .theme-toggles {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .theme-btn {
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: #94a3b8;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .theme-btn.active, .theme-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .launch-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .launch-btn:hover {
            background: #1d4ed8;
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="widget-container" id="widget-box">
        <div class="ambient-glow"></div>

        <div class="header">
            <div class="status-badge" id="badge">
                <span class="pulse-dot" id="dot"></span>
                <span id="badge-text">NOW PLAYING</span>
            </div>
            <span class="brand">GAMINGPIG LIVE</span>
        </div>

        <div class="content">
            <div class="cover-wrap">
                <img id="cover" class="cover-img" src="og-v2.jpg" alt="Cover Art">
            </div>
            <div class="track-info">
                <div class="track-title" id="title">Lade Musik...</div>
                <div class="track-artist" id="artist">Gamingpig</div>
                <a href="https://gamingpig.github.io/about-qa/" target="_blank" rel="noopener" class="spotify-tag" id="spotify-link">
                    <span>🎵 Spotify Live</span>
                </a>
            </div>
        </div>

        <div class="progress-box">
            <div class="bar-bg">
                <div class="bar-fill" id="bar"></div>
            </div>
            <div class="timestamps">
                <span id="cur-time">0:00</span>
                <span id="tot-time">0:00</span>
            </div>
        </div>

        <div class="actions">
            <div class="theme-toggles">
                <button type="button" class="theme-btn active" id="btn-theme-liquid" onclick="applyTheme('liquid')">Liquid</button>
                <button type="button" class="theme-btn" id="btn-theme-oled" onclick="applyTheme('oled')">OLED</button>
                <button type="button" class="theme-btn" id="btn-theme-cyber" onclick="applyTheme('cyber')">Cyber</button>
            </div>
            <a href="./" class="launch-btn" title="Vollständige Website öffnen">
                <span>↗ Website</span>
            </a>
        </div>
    </div>

    <script>
        const NPC_URL = "https://npc-api.aikins.xyz/v1/users/gamingpig/now";
        const STATSFM_URL = "https://api.stats.fm/api/v1/users/gamingpig/streams/current";

        let currentTrack = null;
        let isPlaying = false;
        let progressMs = 0;
        let durationMs = 0;
        let lastSyncTime = 0;

        function fmtTime(ms) {
            if (!ms || isNaN(ms)) return "0:00";
            const s = Math.floor(ms / 1000);
            const m = Math.floor(s / 60);
            const rem = s % 60;
            return m + ":" + (rem < 10 ? "0" : "") + rem;
        }

        function applyTheme(theme) {
            document.body.classList.remove('theme-oled', 'theme-cyber');
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            if (theme === 'oled') {
                document.body.classList.add('theme-oled');
                document.getElementById('btn-theme-oled')?.classList.add('active');
            } else if (theme === 'cyber') {
                document.body.classList.add('theme-cyber');
                document.getElementById('btn-theme-cyber')?.classList.add('active');
            } else {
                document.getElementById('btn-theme-liquid')?.classList.add('active');
            }
            try { localStorage.setItem('gp_widget_theme', theme); } catch(_) {}
        }

        async function fetchLiveTrack() {
            try {
                const [npcRes, statsRes] = await Promise.allSettled([
                    fetch(NPC_URL + "?t=" + Date.now(), { signal: AbortSignal.timeout(3500) }).then(r => r.ok ? r.json() : null),
                    fetch(STATSFM_URL + "?t=" + Date.now(), { signal: AbortSignal.timeout(3500) }).then(r => r.ok ? r.json() : null)
                ]);

                const npc = npcRes.status === 'fulfilled' ? npcRes.value : null;
                const stats = statsRes.status === 'fulfilled' ? statsRes.value : null;

                const item = stats?.item;
                const trk = item?.track || item;
                const stream = stats?.stream;

                if (item && trk && item.isPlaying !== false) {
                    isPlaying = true;
                    durationMs = trk.durationMs || 180000;
                    progressMs = item.progressMs ?? stream?.progressMs ?? 0;
                    lastSyncTime = Date.now();

                    const title = trk.name || npc?.track?.title || "Unbekannter Titel";
                    const artist = (trk.artists && trk.artists.map(a => a?.name).filter(Boolean).join(', ')) || npc?.track?.artist || "Gamingpig";
                    const art = (trk.albums && trk.albums[0]?.image) || npc?.track?.artwork_url || npc?.track?.art || "og-v2.jpg";

                    document.getElementById('title').textContent = title;
                    document.getElementById('artist').textContent = artist;
                    document.getElementById('cover').src = art;

                    document.getElementById('badge').classList.remove('idle');
                    document.getElementById('badge-text').textContent = "NOW PLAYING";
                } else if (npc?.track) {
                    isPlaying = Boolean(npc.isPlaying);
                    durationMs = 210000;
                    progressMs = isPlaying ? 35000 : 0;
                    lastSyncTime = Date.now();

                    document.getElementById('title').textContent = npc.track.title || "Unbekannter Titel";
                    document.getElementById('artist').textContent = npc.track.artist || "Gamingpig";
                    if (npc.track.art) document.getElementById('cover').src = npc.track.art;

                    if (isPlaying) {
                        document.getElementById('badge').classList.remove('idle');
                        document.getElementById('badge-text').textContent = "NOW PLAYING";
                    } else {
                        document.getElementById('badge').classList.add('idle');
                        document.getElementById('badge-text').textContent = "STANDBY";
                    }
                } else {
                    isPlaying = false;
                    document.getElementById('badge').classList.add('idle');
                    document.getElementById('badge-text').textContent = "STANDBY";
                    document.getElementById('title').textContent = "Aktuell ist es ruhig...";
                    document.getElementById('artist').textContent = "Gamingpig Musik-Station";
                }
            } catch(e) {
                console.warn('Widget fetch fallback', e);
            }
        }

        function updateProgress() {
            if (isPlaying && durationMs > 0) {
                const elapsed = Date.now() - lastSyncTime;
                const cur = Math.min(progressMs + elapsed, durationMs);
                const pct = Math.min(100, Math.max(0, (cur / durationMs) * 100));

                document.getElementById('bar').style.width = pct + "%";
                document.getElementById('cur-time').textContent = fmtTime(cur);
                document.getElementById('tot-time').textContent = fmtTime(durationMs);
            } else {
                document.getElementById('bar').style.width = "0%";
                document.getElementById('cur-time').textContent = "0:00";
                document.getElementById('tot-time').textContent = fmtTime(durationMs || 0);
            }
        }

        // Init theme & polling
        const savedTheme = (function() { try { return localStorage.getItem('gp_widget_theme'); } catch(_) { return null; } })() || 'liquid';
        applyTheme(savedTheme);

        fetchLiveTrack();
        setInterval(fetchLiveTrack, 5000);
        setInterval(updateProgress, 1000);
    </script>
</body>
</html>
