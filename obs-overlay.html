    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: transparent;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            padding: 24px;
        }

        /* Widget Container */
        .obs-widget {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 18px 12px 12px;
            background: rgba(10, 15, 29, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 24px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 0 0 24px rgba(59, 130, 246, 0.25);
            max-width: 440px;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .obs-widget.visible {
            transform: translateY(0);
            opacity: 1;
        }

        /* Album Artwork */
        .art-wrap {
            position: relative;
            width: 68px;
            height: 68px;
            flex-shrink: 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #0f172a;
        }

        .art-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        /* Equalizer Bars on Cover */
        .eq-overlay {
            position: absolute;
            bottom: 6px;
            right: 6px;
            display: flex;
            align-items: flex-end;
            gap: 2.5px;
            height: 14px;
            padding: 3px 5px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 6px;
        }

        .eq-bar {
            width: 2.5px;
            background: #22c55e;
            border-radius: 2px;
            animation: eqAnim 1s ease-in-out infinite alternate;
        }

        .eq-bar:nth-child(1) { height: 40%; animation-delay: 0.1s; }
        .eq-bar:nth-child(2) { height: 80%; animation-delay: 0.3s; }
        .eq-bar:nth-child(3) { height: 100%; animation-delay: 0.2s; }
        .eq-bar:nth-child(4) { height: 50%; animation-delay: 0.4s; }

        @keyframes eqAnim {
            0% { height: 20%; }
            100% { height: 100%; }
        }

        /* Track Metadata */
        .track-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
            flex: 1;
        }

            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #22c55e;
            margin-bottom: 4px;
        }

            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

        }

            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);

            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            margin-top: 8px;

            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
            border-radius: 4px;
            transition: width 0.1s linear;
        }

                <span>NOW PLAYING</span>
            </div>
            <div id="track-title" class="title">Wird geladen...</div>
            <div id="track-artist" class="artist">Gamingpig Live</div>
            <div class="progress-bar-container">
                <div id="track-progress" class="progress-fill"></div>
            </div>
        </div>

    <script>
        const API_URL = 'https://npc-api.aikins.xyz/v1/users/gamingpig/now';
        const FALLBACK_ART = 'icon-192.png';

        const widgetEl = document.getElementById('obs-card');
        const titleEl = document.getElementById('track-title');
        const artistEl = document.getElementById('track-artist');
        const artEl = document.getElementById('track-art');
        const progressEl = document.getElementById('track-progress');

        let lastSongKey = '';
        let localStartTime = 0;
        let serverBaseProgress = 0;
        let totalDurationMs = 0;
        let isPlaying = false;
        let timeOffset = 0;
        const coverCache = new Map();

        // 1. Präziser Zeit-Sync mit WorldTime / Server
        async function syncTime() {
            try {
                const t0 = performance.now();
                const res = await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC', { cache: 'no-store' });
                const data = await res.json();
                const t1 = performance.now();
                const latency = (t1 - t0) / 2;
                const serverTime = new Date(data.utc_datetime).getTime();
                timeOffset = (serverTime + latency) - Date.now();
            } catch(e) {}
        }
        syncTime();
        setInterval(syncTime, 600000);

        function getTrueDateNow() {
            return Date.now() + timeOffset;
        }

        async function resolveCover(title, artist, rawArt, platformLinks) {
            const key = `${title}___${artist}`.toLowerCase();
            if (coverCache.has(key)) return coverCache.get(key);

            // 1. Deezer
            try {
                const q = encodeURIComponent(`${artist} ${title}`);
                const r = await fetch(`https://api.deezer.com/search?q=${q}&limit=1`);
                const d = await r.json();
                const cover = d?.data?.[0]?.album?.cover_xl || d?.data?.[0]?.album?.cover_big;
                if (cover) {
                    coverCache.set(key, cover);
                    return cover;
                }
            } catch(e) {}

            // 2. iTunes
            try {
                const q = encodeURIComponent(`${artist} ${title}`);
                const r = await fetch(`https://itunes.apple.com/search?term=${q}&media=music&entity=song&limit=1`);
                const d = await r.json();
                let art = d?.results?.[0]?.artworkUrl100;
                if (art) {
                    art = art.replace('100x100bb', '600x600bb');
                    coverCache.set(key, art);
                    return art;
                }
            } catch(e) {}

            if (rawArt && rawArt.startsWith('http') && !rawArt.includes('npc-api.aikins.xyz/v1/artwork/')) {
                coverCache.set(key, rawArt);
                return rawArt;
            }

            return FALLBACK_ART;
        }

        async function fetchNowPlaying() {
            try {
                let data = null;
                try {
                    const res = await fetch(API_URL, { cache: 'no-store', signal: AbortSignal.timeout(2500) });
                    if (res.status === 200) {
                        data = await res.json();
                    }
                } catch(e) {}

                // Fallback auf stats.fm, wenn NPC 204 oder offline ist
                if (!data || data.status !== 'playing' || !data.track) {
                    try {
                        const sfmRes = await fetch('https://api.stats.fm/api/v1/users/gamingpig/streams/current', { cache: 'no-store', signal: AbortSignal.timeout(3500) });
                        if (sfmRes.status === 200) {
                            const payload = await sfmRes.json();
                            const item = payload && payload.item;
                            const trk = item && item.track;
                            if (item && trk && item.isPlaying) {
                                const artists = Array.isArray(trk.artists) ? trk.artists.map(a => a && a.name).filter(Boolean) : [];
                                const albums = trk.albums || [];
                                const album = albums[0] || {};
                                data = {
                                    status: 'playing',
                                    progress_ms: Number(item.progressMs) || 0,
                                    timestamp: Date.now(),
                                    track: {
                                        title: trk.name || '',
                                        artist: artists.join(', ') || 'Unknown',
                                        artwork_url: album.image || '',
                                        duration_ms: Number(trk.durationMs) || 0,
                                        progress_ms: Number(item.progressMs) || 0,
                                        platform_links: {}
                                    }
                                };
                            }
                        }
                    } catch(e) {}
                }

                if (!data) throw new Error('API down');

                const status = data.status;
                const track = data.track || {};
                const title = track.title || track.name;
                const artist = track.artist || '';
                const rawArt = track.artwork_url || '';
                const duration = track.duration_ms || 0;
                let apiProgress = track.progress_ms || data.progress_ms || 0;
                const platformLinks = track.platform_links || {};

                if (status === 'playing' && title && title !== 'Aktuell ist es ruhig...') {
                    isPlaying = true;
                    totalDurationMs = duration;

                    // Server-Alter und Latenz kompensieren (Exakt wie auf der Hauptseite!)
                    let serverTimestamp = data.timestamp || data.updated_at || (data.track && data.track.timestamp);
                    if (serverTimestamp) {
                        let st = typeof serverTimestamp === 'number'
                            ? (serverTimestamp < 20000000000 ? serverTimestamp * 1000 : serverTimestamp)
                            : new Date(serverTimestamp).getTime();
                        let rawAge = getTrueDateNow() - st;
                        if (rawAge >= 0 && rawAge <= (duration || 600000)) {
                            apiProgress += rawAge;
                        }
                    }

                    const songKey = `${title}-${artist}`;
                    if (songKey !== lastSongKey) {
                        lastSongKey = songKey;
                        titleEl.innerText = title;
                        artistEl.innerText = artist;

                        serverBaseProgress = apiProgress;
                        localStartTime = performance.now();

                        resolveCover(title, artist, rawArt, platformLinks).then(artUrl => {
                            if (artEl.getAttribute('src') !== artUrl) artEl.src = artUrl;
                        });
                    } else {
                        // Glatter Drift-Sync ohne Springen
                        const expectedLocalProgress = serverBaseProgress + (performance.now() - localStartTime);
                        const drift = apiProgress - expectedLocalProgress;
                        const absDrift = Math.abs(drift);

                        if (absDrift > 1200) {
                            serverBaseProgress = apiProgress;
                            localStartTime = performance.now();
                        } else if (absDrift > 150) {
                            serverBaseProgress = expectedLocalProgress + drift * 0.35;
                            localStartTime = performance.now();
                        }
                    }

                    widgetEl.classList.add('visible');
                } else {
                    isPlaying = false;
                    lastSongKey = '';
                    widgetEl.classList.remove('visible');
                }
            } catch (err) {
                widgetEl.classList.remove('visible');
            }
        }

        // Kontinuierlicher 60-FPS Fortschrittsbalken
        function tickProgress() {
            if (isPlaying && totalDurationMs > 0) {
                const elapsed = performance.now() - localStartTime;
                const current = Math.min(totalDurationMs, serverBaseProgress + elapsed);
                const percent = Math.max(0, Math.min(100, (current / totalDurationMs) * 100));
                progressEl.style.width = `${percent}%`;
            }
            requestAnimationFrame(tickProgress);
        }

        setInterval(fetchNowPlaying, 3000);
        fetchNowPlaying();
        requestAnimationFrame(tickProgress);
